[package]
name = "xgboost_lib-sys"
version.workspace = true
authors.workspace = true
links = "xgboost"
build = "build.rs"
license.workspace = true
repository.workspace = true
description = "Native bindings to the xgboost library"
readme = "README.md"
edition.workspace = true
publish.workspace = true

[dependencies]
libc.workspace = true

[build-dependencies]
bindgen = { version = "0.72" }
dunce = { version = "1.0.5" }
cmake = { version = "0.1" }

# This crate always builds libxgboost from source as a static, CPU-only
# library. There are intentionally no features for selecting prebuilt binaries,
# dynamic linking, or CUDA — see build.rs.
