[package]
name = "xgboost_lib-sys"
version = "3.0.6-dsai"
authors = ["Dave Challis <dave@suicas.net>", "Marco Mengelkoch"]
links = "xgboost"
build = "build.rs"
license = "MIT"
repository = "https://github.com/marcomq/rust-xgboost"
description = "Native bindings to the xgboost library"
readme = "README.md"
edition = "2021"
exclude = [
    "lib/*",
]
publish = ["ge"]

[dependencies]
libc = "0.2"

[build-dependencies]
bindgen = { version = "0.71" }
dunce =  { version = "1.0.5" }
reqwest = { version = "0.12.15", features = ["blocking"], optional = true }
cmake = { version = "0.1", optional = true } 

[features]
default = ["use_prebuilt_xgb"]
use_prebuilt_xgb = ["reqwest"]
local_build = ["cmake"]
# Link libxgboost statically. Always implied for android (no .so prebuilt
# exists). On Linux and other platforms, dynamic linking is the default;
# enable this flag to produce a self-contained binary (e.g. for cargo-deb).
# When combined with `local_build`, also sets BUILD_STATIC_LIB=ON in the
# CMake invocation so the static archive is actually produced.
static_link = []
cuda = []
